server.port=${PORT:8080}
spring.application.name=sentinel-api
spring.config.import=optional:file:./application-local.properties
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sentinel}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.initialization-fail-timeout=-1
spring.sql.init.mode=never
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.error.include-stacktrace=never
server.tomcat.max-http-form-post-size=7100000
sentinel.supabase-url=${SUPABASE_URL:https://your-project.supabase.co}
sentinel.supabase-anon-key=${SUPABASE_ANON_KEY:your-supabase-anon-key}
sentinel.allowed-origins=${ALLOWED_ORIGINS:http://127.0.0.1:5174,http://localhost:5174}
sentinel.gemini-key=${GEMINI_API_KEY:your-gemini-api-key}
sentinel.gemini-model=${GEMINI_MODEL:gemini-2.5-flash}
sentinel.cloudinary-cloud=${CLOUDINARY_CLOUD_NAME:your-cloud-name}
sentinel.cloudinary-key=${CLOUDINARY_API_KEY:your-cloudinary-key}
sentinel.cloudinary-secret=${CLOUDINARY_API_SECRET:your-cloudinary-secret}
